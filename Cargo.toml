[workspace]
members = ["app-config", "node", "wallet-core", "wallet-cli"]
resolver = "2"

[workspace.package]
version = "0.2.20"
edition = "2024"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
bip39 = "2.2"
borsh = { version = "1.8", features = ["derive"] }
chacha20poly1305 = "0.10"
ctrlc = "3.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
igd-next = "0.17"
lmdb = { package = "lmdb-rkv", version = "0.14" }
paqus = { version = "0.2.20", default-features = false }
paqus-app-config = { path = "app-config", default-features = false }
prost = "0.14"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
zeroize = { version = "1.8", features = ["derive"] }
